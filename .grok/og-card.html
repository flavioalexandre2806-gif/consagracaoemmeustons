html, body {
  margin: 0;
  padding: 0;
  width: 1200px;
  height: 630px;
  background: #070707;
  overflow: hidden;
}
.card {
  position: relative;
  width: 1200px;
  height: 630px;
  background:
    radial-gradient(120% 80% at 50% 50%, #12110f 0%, #070707 62%);
  color: #F6F3EC;
  display: flex;
  align-items: center;
  justify-content: center;
}
.frame {
  position: absolute;
  inset: 36px;
  border: 1px solid rgba(154, 149, 140, 0.55);
  pointer-events: none;
}
.frame::after {
  content: "";
  position: absolute;
  inset: 6px;
  border: 1px solid rgba(232, 226, 214, 0.16);
}
.lockup {
  text-align: center;
  width: 720px;
  position: relative;
  z-index: 1;
}
.eyebrow {
  font-family: 'Source Sans 3', sans-serif;
  font-size: 13px;
  letter-spacing: 0.46em;
  text-indent: 0.46em;
  text-transform: uppercase;
  color: #9A958C;
  margin: 0 0 28px;
  font-weight: 400;
}
.title {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 600;
  font-size: 92px;
  line-height: 0.92;
  margin: 0;
  color: #F6F3EC;
  letter-spacing: -0.01em;
}
.subtitle {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-weight: 400;
  font-size: 44px;
  line-height: 1.1;
  margin: 10px 0 0;
  color: #E8E2D6;
}
.rule {
  width: 72px;
  height: 1px;
  background: #9A958C;
  margin: 32px auto 22px;
}
.byline {
  font-family: 'Source Sans 3', sans-serif;
  font-size: 15px;
  letter-spacing: 0.34em;
  text-indent: 0.34em;
  text-transform: uppercase;
  color: #9A958C;
  margin: 0;
}
</style>
</head>
<body>
  <div class="card">
    <div class="frame"></div>
    <div class="lockup">
      <p class="eyebrow">Música litúrgica</p>
      <h1 class="title">Consagração</h1>
      <p class="subtitle">em Meus Tons</p>
      <div class="rule"></div>
      <p class="byline">Flávio Vieira</p>
    </div>
  </div>
</body>
</html>
